# BLAKE3 est une dépendance tierce : src/third_party/blake3/.

stages:
  - quality
  - build
  - test
  - security

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  GIT_DEPTH: "0"
  SAST_EXCLUDED_PATHS: "src/third_party/**,third_party/**"

cppcheck:
  stage: quality
  image: gcc:16.2
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends cppcheck
    - rm -rf /var/lib/apt/lists/*
  script:
    - |
      set -eu

      echo "Répertoire courant"
      pwd
      echo "Contenu du dépôt"
      ls -la
      echo "Sources C"
      find src -maxdepth 1 -type f -name '*.c' -print
      echo "Headers"
      find include -maxdepth 1 -type f -name '*.h' -print
      echo "Analyse Cppcheck"
      find src include -maxdepth 1 -type f \
        \( -name '*.c' -o -name '*.h' \) \
        ! -path 'src/third_party/*' \
        -print > /tmp/cppcheck-files.txt
      if [ ! -s /tmp/cppcheck-files.txt ]; then
        echo "ERREUR : aucun fichier C ou header trouvé."
        exit 1
      fi
      xargs cppcheck \
        --enable=warning,performance,portability \
        --error-exitcode=1 \
        --inline-suppr \
        --suppress=missingIncludeSystem \
        -I include \
        < /tmp/cppcheck-files.txt

  rules:
    - changes:
        - src/*.c
        - include/*.h
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-gcc:
  stage: build
  image: gcc:16.2
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends libssl-dev
    - rm -rf /var/lib/apt/lists/*
  script:
    - |
      set -eu

      BUILD_DIR="build/ci-gcc"
      BLAKE3_DIR="src/third_party/blake3/c"

      mkdir -p "$BUILD_DIR"

      for source in src/*.c; do
        [ -f "$source" ] || continue

        object="$BUILD_DIR/$(basename "${source%.c}").o"

        gcc \
          -std=c23 \
          -Wall -Wextra -Wpedantic -Werror \
          -Iinclude \
          -I"$BLAKE3_DIR" \
          -c "$source" \
          -o "$object"
      done

      for source in blake3.c blake3_dispatch.c blake3_portable.c; do
        gcc \
          -std=c11 -O2 \
          -DBLAKE3_NO_SSE2 \
          -DBLAKE3_NO_SSE41 \
          -DBLAKE3_NO_AVX2 \
          -DBLAKE3_NO_AVX512 \
          -I"$BLAKE3_DIR" \
          -c "$BLAKE3_DIR/$source" \
          -o "$BUILD_DIR/vendor_${source%.c}.o"
      done

      gcc "$BUILD_DIR"/*.o -lcrypto -o "$BUILD_DIR/t3c"

      "$BUILD_DIR/t3c" --help || true
  artifacts:
    paths:
      - build/ci-gcc/t3c
    expire_in: 1 week

build-clang:
  stage: build
  image: gcc:16.2
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends clang libssl-dev
    - rm -rf /var/lib/apt/lists/*
  script:
    - |
      set -eu

      BUILD_DIR="build/ci-clang"
      BLAKE3_DIR="src/third_party/blake3/c"

      mkdir -p "$BUILD_DIR"

      # Clang utilise c2x pour la compatibilité avec les versions
      # qui ne reconnaissent pas encore le nom c23.
      for source in src/*.c; do
        [ -f "$source" ] || continue

        object="$BUILD_DIR/$(basename "${source%.c}").o"

        clang \
          -std=c2x \
          -Wall -Wextra -Wpedantic -Werror \
          -Iinclude \
          -I"$BLAKE3_DIR" \
          -c "$source" \
          -o "$object"
      done

      for source in blake3.c blake3_dispatch.c blake3_portable.c; do
        clang \
          -std=c11 -O2 \
          -DBLAKE3_NO_SSE2 \
          -DBLAKE3_NO_SSE41 \
          -DBLAKE3_NO_AVX2 \
          -DBLAKE3_NO_AVX512 \
          -I"$BLAKE3_DIR" \
          -c "$BLAKE3_DIR/$source" \
          -o "$BUILD_DIR/vendor_${source%.c}.o"
      done

      clang "$BUILD_DIR"/*.o -lcrypto -o "$BUILD_DIR/t3c"

# for test later

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
